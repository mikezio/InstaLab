{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Mockups</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 26px; }
    .note { color: #555; margin-bottom: 20px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    img { width: 100%; border: 1px solid #ddd; border-radius: 12px; }
    .caption { margin-top: 6px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>InstaLab – Visual directions</h1>
  <div class="note">Three distinct styles: Editorial Product, Creator Studio, Soft Glass.</div>

  <h2>A) Editorial Product</h2>
  <div class="grid">
    <div>
      <img src="{% static 'ui_mockA_desktop.png' %}" alt="Editorial desktop" />
      <div class="caption">Desktop</div>
    </div>
    <div>
      <img src="{% static 'ui_mockA_mobile.png' %}" alt="Editorial mobile" />
      <div class="caption">Mobile</div>
    </div>
  </div>

  <h2>B) Creator Studio</h2>
  <div class="grid">
    <div>
      <img src="{% static 'ui_mockB_desktop.png' %}" alt="Creator desktop" />
      <div class="caption">Desktop</div>
    </div>
    <div>
      <img src="{% static 'ui_mockB_mobile.png' %}" alt="Creator mobile" />
      <div class="caption">Mobile</div>
    </div>
  </div>

  <h2>C) Soft Glass</h2>
  <div class="grid">
    <div>
      <img src="{% static 'ui_mockC_desktop.png' %}" alt="Soft glass desktop" />
      <div class="caption">Desktop</div>
    </div>
    <div>
      <img src="{% static 'ui_mockC_mobile.png' %}" alt="Soft glass mobile" />
      <div class="caption">Mobile</div>
    </div>
  </div>
</body>
</html>
