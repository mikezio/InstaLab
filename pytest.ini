[pytest]
# Pytest configuration for InstaLab

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test paths
testpaths = app/tests

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = 
#     --cov=app
#     --cov-report=html
#     --cov-report=term-missing

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
