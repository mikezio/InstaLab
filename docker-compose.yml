services:
  instalab-api:
    build:
      context: /srv/apps/instalab
    container_name: instalab-api
    user: "1001:1003"
    command: ddtrace-run python server.py
    env_file:
      - /srv/secrets/instalab.env
    environment:
      INSTALAB_ENV: /srv/secrets/instalab.env
      INSTALAB_DB_HOST: apps-postgres
      HOME: /data/instalab/home
      DD_SERVICE: instalab-api
      DD_ENV: homelab
      DD_VERSION: "1"
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_AGENT_HOST: 192.168.4.30
      DD_TRACE_AGENT_PORT: "8126"
    volumes:
      - /srv/apps/instalab/app:/app
      - /srv/secrets/instalab.env:/srv/secrets/instalab.env:ro
      - /srv/secrets/instalab-logins.json:/srv/secrets/instalab-logins.json
      - /srv/secrets/instalab-cookies:/data/instalab/cookies
      - /srv/data/instalab:/data/instalab
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - apps-db

  instalab-ui:
    build:
      context: /srv/apps/instalab
    container_name: instalab-ui
    user: "1001:1003"
    command: /app/scripts/start_ui.sh
    env_file:
      - /srv/secrets/instalab.env
    environment:
      INSTALAB_ENV: /srv/secrets/instalab.env
      INSTALAB_API_BASE: http://instalab-api:5000/
      INSTALAB_DB_HOST: apps-postgres
      DD_SERVICE: instalab-ui
      DD_ENV: homelab
      DD_VERSION: "1"
      DD_TRACE_ENABLED: "true"
      DD_LOGS_INJECTION: "true"
      DD_RUNTIME_METRICS_ENABLED: "true"
      DD_AGENT_HOST: 192.168.4.30
      DD_TRACE_AGENT_PORT: "8126"
    volumes:
      - /srv/apps/instalab/app:/app
      - /srv/secrets/instalab.env:/srv/secrets/instalab.env:ro
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      - instalab-api
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - apps-db

  instalab-vnc:
    build:
      context: /srv/apps/instalab
    container_name: instalab-vnc
    user: "1001:1003"
    command: /app/scripts/start_vnc.sh
    environment:
      DISPLAY_NUM: "1"
      VNC_PORT: "5900"
      NOVNC_PORT: "7900"
    volumes:
      - /srv/apps/instalab/app:/app
      - /srv/secrets/instalab-cookies:/data/instalab/cookies
      - /srv/data/instalab:/data/instalab
    ports:
      - "127.0.0.1:7900:7900"
    restart: unless-stopped

networks:
  apps-db:
    external: true
    name: apps-db
